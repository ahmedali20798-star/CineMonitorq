build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 10
  LongParameterList:
    active: true
    functionThreshold: 22
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    active: true
    threshold: 160
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  NestedBlockDepth:
    active: true
    threshold: 5
  ComplexCondition:
    active: true
    threshold: 5

style:
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludeCommentStatements: true
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 1
  UnusedPrivateProperty:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
